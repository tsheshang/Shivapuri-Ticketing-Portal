<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar scrolled" id="navbar">
    <div class="logo">Shivapuri Nagarjun National Park</div>
    <nav>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="tickets.html">Tickets</a></li>
            <li><a href="my-bookings.html">My Bookings</a></li>
            <li><a href="about.html">About Park</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><a href="login.html" class="btn-login">Login</a></li>
        </ul>
    </nav>
</header>

<section class="page-hero" style="background-image: url('https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1600&q=80');">
    <div class="hero-overlay"></div>
    <div class="page-hero-content">
        <span class="hero-tag">WE'D LOVE TO HEAR FROM YOU</span>
        <h1>Get in Touch</h1>
        <p class="page-sub">Questions about your visit? We're here to help.</p>

        <div class="glass-card">
            <form action="../../backend/controllers/contactController.php" method="POST" class="ticket-form">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="you@example.com" required>

                <label for="message">Message</label>
                <textarea name="message" id="message" rows="5" placeholder="How can we help?" required></textarea>

                <button type="submit" class="btn-primary">Send Message</button>
            </form>
        </div>
    </div>
</section>

<footer class="footer">
    <p>&copy; 2026 Shivapuri National Park Ticketing Portal. All rights reserved.</p>
    <p>Kathmandu, Nepal</p>
</footer>

<script src="../assets/js/main.js"></script>
</body>
</html>
